<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CV2.0 算法模型自进化商业飞轮竖版</title>
  <desc id="desc">深象平台 A 轮融资材料竖版图，表达数据资产化、能力平台化、方案产品化、交付规模化的自进化飞轮。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .eyebrow { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .title { font: 800 52px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 600 27px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .coreTitle { font: 800 30px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .coreText { font: 700 28px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .cardTitle { font: 800 39px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .cardSub { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ecfeff; letter-spacing: 0; }
      .label { font: 800 23px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .body { font: 600 29px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .pill { font: 800 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .arrowText { font: 800 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .metricTitle { font: 800 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .metricBody { font: 600 20px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <path d="M70 225 C300 160 480 210 665 170 C800 140 910 150 1010 118" fill="none" stroke="#dbeafe" stroke-width="3"/>
  <path d="M60 1540 C310 1485 535 1548 760 1498 C880 1472 965 1465 1020 1440" fill="none" stroke="#d1fae5" stroke-width="3"/>

  <text x="80" y="86" class="eyebrow">A轮融资版技术方案页</text>
  <text x="80" y="153" class="title">CV2.0 自进化飞轮</text>
  <text x="80" y="202" class="subtitle">数据壁垒 · 能力复用 · 方案复制 · 收入留存</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="920" height="120" rx="32" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="108" y="282" width="170" height="56" rx="28" fill="#0f172a"/>
  </g>
  <text x="193" y="319" text-anchor="middle" class="coreTitle">核心结论</text>
  <text x="318" y="319" class="coreText">不是项目制，而是复利平台</text>
  <text x="318" y="351" class="metricBody">交付越多，数据越厚；方案越标准，毛利越高</text>

  <!-- Return loop -->
  <path d="M60 1338 C22 1040 22 740 60 440" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowReturn)" opacity="0.78"/>
  <rect x="18" y="780" width="74" height="260" rx="32" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="55" y="910" text-anchor="middle" class="font" transform="rotate(-90 55 910)" style="font-size:24px;font-weight:800;fill:#059669;letter-spacing:0;">价值反馈 · 数据回流</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="110" y="410" width="860" height="220" rx="30" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="110" y="410" width="860" height="88" rx="30" fill="url(#greenGrad)"/>
    <rect x="110" y="468" width="860" height="30" fill="#10b981"/>
  </g>
  <circle cx="164" cy="454" r="30" fill="#ffffff"/>
  <text x="164" y="465" text-anchor="middle" class="font" style="font-size:30px;font-weight:900;fill:#059669;">1</text>
  <text x="214" y="453" class="cardTitle">天工平台</text>
  <text x="214" y="486" class="cardSub">数据资产化引擎</text>
  <text x="150" y="552" class="label" fill="#047857">投资看点</text>
  <text x="285" y="552" class="body">客户数据回流，形成专有样本壁垒</text>
  <rect x="150" y="580" width="190" height="40" rx="20" fill="#ecfdf5"/>
  <rect x="363" y="580" width="190" height="40" rx="20" fill="#ecfdf5"/>
  <rect x="576" y="580" width="190" height="40" rx="20" fill="#ecfdf5"/>
  <text x="245" y="607" text-anchor="middle" class="pill" fill="#047857">数据壁垒</text>
  <text x="458" y="607" text-anchor="middle" class="pill" fill="#047857">自训练</text>
  <text x="671" y="607" text-anchor="middle" class="pill" fill="#047857">效果提升</text>

  <path d="M540 646 L540 680" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowDown)"/>
  <text x="568" y="672" class="arrowText">能力沉淀</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="110" y="700" width="860" height="220" rx="30" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="110" y="700" width="860" height="88" rx="30" fill="url(#blueGrad)"/>
    <rect x="110" y="758" width="860" height="30" fill="#38bdf8"/>
  </g>
  <circle cx="164" cy="744" r="30" fill="#ffffff"/>
  <text x="164" y="755" text-anchor="middle" class="font" style="font-size:30px;font-weight:900;fill:#1d4ed8;">2</text>
  <text x="214" y="743" class="cardTitle">星象平台</text>
  <text x="214" y="776" class="cardSub">能力平台化中枢</text>
  <text x="150" y="842" class="label" fill="#1d4ed8">投资看点</text>
  <text x="285" y="842" class="body">统一接入编排，能力模块复用</text>
  <rect x="150" y="870" width="190" height="40" rx="20" fill="#eff6ff"/>
  <rect x="363" y="870" width="190" height="40" rx="20" fill="#eff6ff"/>
  <rect x="576" y="870" width="190" height="40" rx="20" fill="#eff6ff"/>
  <text x="245" y="897" text-anchor="middle" class="pill" fill="#1d4ed8">人效提升</text>
  <text x="458" y="897" text-anchor="middle" class="pill" fill="#1d4ed8">成本下降</text>
  <text x="671" y="897" text-anchor="middle" class="pill" fill="#1d4ed8">可治理</text>

  <path d="M540 936 L540 970" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowDown)"/>
  <text x="568" y="962" class="arrowText">方案编排</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="110" y="990" width="860" height="220" rx="30" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="110" y="990" width="860" height="88" rx="30" fill="url(#purpleGrad)"/>
    <rect x="110" y="1048" width="860" height="30" fill="#a855f7"/>
  </g>
  <circle cx="164" cy="1034" r="30" fill="#ffffff"/>
  <text x="164" y="1045" text-anchor="middle" class="font" style="font-size:30px;font-weight:900;fill:#6d28d9;">3</text>
  <text x="214" y="1033" class="cardTitle">万象平台</text>
  <text x="214" y="1066" class="cardSub">行业方案产品化工厂</text>
  <text x="150" y="1132" class="label" fill="#6d28d9">投资看点</text>
  <text x="285" y="1132" class="body">行业模板沉淀，项目变产品</text>
  <rect x="150" y="1160" width="190" height="40" rx="20" fill="#f5f3ff"/>
  <rect x="363" y="1160" width="190" height="40" rx="20" fill="#f5f3ff"/>
  <rect x="576" y="1160" width="190" height="40" rx="20" fill="#f5f3ff"/>
  <text x="245" y="1187" text-anchor="middle" class="pill" fill="#6d28d9">快速复制</text>
  <text x="458" y="1187" text-anchor="middle" class="pill" fill="#6d28d9">标准交付</text>
  <text x="671" y="1187" text-anchor="middle" class="pill" fill="#6d28d9">毛利提升</text>

  <path d="M540 1226 L540 1260" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowDown)"/>
  <text x="568" y="1252" class="arrowText">业务落地</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="110" y="1280" width="860" height="220" rx="30" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="110" y="1280" width="860" height="88" rx="30" fill="url(#orangeGrad)"/>
    <rect x="110" y="1338" width="860" height="30" fill="#f59e0b"/>
  </g>
  <circle cx="164" cy="1324" r="30" fill="#ffffff"/>
  <text x="164" y="1335" text-anchor="middle" class="font" style="font-size:30px;font-weight:900;fill:#ea580c;">4</text>
  <text x="214" y="1323" class="cardTitle">业务交付</text>
  <text x="214" y="1356" class="cardSub">规模化落地与价值兑现</text>
  <text x="150" y="1422" class="label" fill="#c2410c">投资看点</text>
  <text x="285" y="1422" class="body">最后一公里交付，沉淀收入留存</text>
  <rect x="150" y="1450" width="190" height="40" rx="20" fill="#fff7ed"/>
  <rect x="363" y="1450" width="190" height="40" rx="20" fill="#fff7ed"/>
  <rect x="576" y="1450" width="190" height="40" rx="20" fill="#fff7ed"/>
  <text x="245" y="1477" text-anchor="middle" class="pill" fill="#c2410c">ARR</text>
  <text x="458" y="1477" text-anchor="middle" class="pill" fill="#c2410c">验收率</text>
  <text x="671" y="1477" text-anchor="middle" class="pill" fill="#c2410c">续费率</text>

  <!-- Metrics -->
  <g filter="url(#softShadow)">
    <rect x="80" y="1580" width="920" height="260" rx="30" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="120" y="1634" class="font" style="font-size:30px;font-weight:900;fill:#0f172a;letter-spacing:0;">技术亮点</text>
  <rect x="120" y="1662" width="390" height="62" rx="20" fill="#ecfdf5"/>
  <rect x="570" y="1662" width="390" height="62" rx="20" fill="#eff6ff"/>
  <rect x="120" y="1750" width="390" height="62" rx="20" fill="#f5f3ff"/>
  <rect x="570" y="1750" width="390" height="62" rx="20" fill="#fff7ed"/>
  <text x="152" y="1701" class="metricTitle">数据飞轮</text>
  <text x="295" y="1701" class="metricBody">回流 / 自训 / 评测</text>
  <text x="602" y="1701" class="metricTitle">能力编排</text>
  <text x="745" y="1701" class="metricBody">API / Agent / Skill</text>
  <text x="152" y="1789" class="metricTitle">方案沉淀</text>
  <text x="295" y="1789" class="metricBody">模板 / 流程 / 复用</text>
  <text x="602" y="1789" class="metricTitle">交付闭环</text>
  <text x="745" y="1789" class="metricBody">多云 / 设备 / 运营</text>
</svg>
