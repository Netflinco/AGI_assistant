<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CV2.0 算法模型自进化商业飞轮</title>
  <desc id="desc">深象平台面向 A 轮融资材料的投资视角技术方案图，强调数据资产化、能力平台化、方案产品化、交付规模化和价值反哺。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font: 700 52px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 25px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .eyebrow { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .cardTitle { font: 700 31px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .cardSub { font: 600 19px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #eaf8ff; }
      .label { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .body { font: 400 20px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .metric { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .nodeTitle { font: 700 20px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .nodeSub { font: 400 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .centerTitle { font: 800 38px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .centerSub { font: 500 20px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .conclusion { font: 700 26px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M120 180 C420 116 650 168 910 126 C1180 82 1400 126 1800 76" fill="none" stroke="#dbeafe" stroke-width="3" opacity="0.75"/>
  <path d="M100 890 C360 818 620 900 905 856 C1208 810 1450 848 1815 780" fill="none" stroke="#d1fae5" stroke-width="3" opacity="0.7"/>

  <text x="120" y="82" class="eyebrow">A轮融资版技术方案页</text>
  <text x="120" y="142" class="title">CV2.0 算法模型自进化商业飞轮</text>
  <text x="122" y="185" class="subtitle">数据壁垒 · 能力复用 · 方案复制 · 收入留存</text>
  <rect x="1510" y="60" width="290" height="54" rx="27" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1542" y="95" class="font" style="font-size:20px;font-weight:700;fill:#1d4ed8;">越交付 · 越精准 · 越可复制</text>

  <path d="M640 270 C765 190 1138 190 1280 270" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)" opacity="0.72"/>
  <text x="850" y="234" class="font" style="font-size:20px;font-weight:700;fill:#2563eb;">能力标准化</text>
  <path d="M1815 505 C1885 548 1885 630 1815 675" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowPurple)" opacity="0.72"/>
  <text x="1746" y="578" class="font" transform="rotate(90 1746 578)" style="font-size:20px;font-weight:700;fill:#7c3aed;">方案复制</text>
  <path d="M1280 850 C1125 925 790 925 640 850" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)" opacity="0.72"/>
  <text x="880" y="910" class="font" style="font-size:20px;font-weight:700;fill:#ea580c;">价值反哺</text>
  <path d="M105 675 C38 620 38 315 105 270" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)" opacity="0.72"/>
  <text x="42" y="496" class="font" transform="rotate(-90 42 496)" style="font-size:20px;font-weight:700;fill:#059669;">数据回流</text>

  <!-- Card 1 -->
  <g filter="url(#softShadow)">
    <rect x="120" y="235" width="500" height="278" rx="30" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="120" y="235" width="500" height="98" rx="30" fill="url(#greenGrad)"/>
    <rect x="120" y="303" width="500" height="30" fill="#10b981"/>
  </g>
  <circle cx="168" cy="283" r="25" fill="#ffffff" opacity="0.95"/>
  <path d="M152 276 C152 268 184 268 184 276 V291 C184 299 152 299 152 291 Z" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M152 276 C152 284 184 284 184 276" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="208" y="277" class="cardTitle">01 天工平台</text>
  <text x="210" y="314" class="cardSub">数据资产化引擎</text>
  <text x="162" y="388" class="label" fill="#047857">投资看点</text>
  <text x="162" y="430" class="body">客户数据回流，沉淀专有样本资产</text>
  <rect x="160" y="462" width="122" height="42" rx="21" fill="#ecfdf5"/>
  <rect x="300" y="462" width="122" height="42" rx="21" fill="#ecfdf5"/>
  <rect x="440" y="462" width="122" height="42" rx="21" fill="#ecfdf5"/>
  <text x="221" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#047857;">数据壁垒</text>
  <text x="361" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#047857;">低成本迭代</text>
  <text x="501" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#047857;">效果提升</text>

  <!-- Card 2 -->
  <g filter="url(#softShadow)">
    <rect x="1300" y="235" width="500" height="278" rx="30" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1300" y="235" width="500" height="98" rx="30" fill="url(#blueGrad)"/>
    <rect x="1300" y="303" width="500" height="30" fill="#38bdf8"/>
  </g>
  <circle cx="1348" cy="283" r="25" fill="#ffffff" opacity="0.95"/>
  <path d="M1333 283 H1363 M1348 268 V298 M1337 272 H1359 M1337 294 H1359" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="1388" y="277" class="cardTitle">02 星象平台</text>
  <text x="1390" y="314" class="cardSub">能力平台化中枢</text>
  <text x="1342" y="388" class="label" fill="#1d4ed8">投资看点</text>
  <text x="1342" y="430" class="body">统一接入与编排，能力模块复用</text>
  <rect x="1340" y="462" width="122" height="42" rx="21" fill="#eff6ff"/>
  <rect x="1480" y="462" width="122" height="42" rx="21" fill="#eff6ff"/>
  <rect x="1620" y="462" width="122" height="42" rx="21" fill="#eff6ff"/>
  <text x="1401" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#1d4ed8;">人效提升</text>
  <text x="1541" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#1d4ed8;">成本下降</text>
  <text x="1681" y="489" text-anchor="middle" class="small" style="font-weight:800;fill:#1d4ed8;">可治理</text>

  <!-- Card 3 -->
  <g filter="url(#softShadow)">
    <rect x="1300" y="590" width="500" height="278" rx="30" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="1300" y="590" width="500" height="98" rx="30" fill="url(#purpleGrad)"/>
    <rect x="1300" y="658" width="500" height="30" fill="#a855f7"/>
  </g>
  <circle cx="1348" cy="638" r="25" fill="#ffffff" opacity="0.95"/>
  <path d="M1334 628 H1363 V642 H1353 V652 H1334 Z" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>
  <text x="1388" y="632" class="cardTitle">03 万象平台</text>
  <text x="1390" y="669" class="cardSub">行业方案产品化工厂</text>
  <text x="1342" y="743" class="label" fill="#6d28d9">投资看点</text>
  <text x="1342" y="785" class="body">行业模板沉淀，项目变产品</text>
  <rect x="1340" y="817" width="122" height="42" rx="21" fill="#f5f3ff"/>
  <rect x="1480" y="817" width="122" height="42" rx="21" fill="#f5f3ff"/>
  <rect x="1620" y="817" width="122" height="42" rx="21" fill="#f5f3ff"/>
  <text x="1401" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#6d28d9;">快速复制</text>
  <text x="1541" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#6d28d9;">毛利提升</text>
  <text x="1681" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#6d28d9;">标准交付</text>

  <!-- Card 4 -->
  <g filter="url(#softShadow)">
    <rect x="120" y="590" width="500" height="278" rx="30" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="120" y="590" width="500" height="98" rx="30" fill="url(#orangeGrad)"/>
    <rect x="120" y="658" width="500" height="30" fill="#f59e0b"/>
  </g>
  <circle cx="168" cy="638" r="25" fill="#ffffff" opacity="0.95"/>
  <path d="M154 639 L164 649 L183 627" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="208" y="632" class="cardTitle">04 业务交付</text>
  <text x="210" y="669" class="cardSub">规模化落地与价值兑现</text>
  <text x="162" y="743" class="label" fill="#c2410c">投资看点</text>
  <text x="162" y="785" class="body">最后一公里交付，转化收入与续约</text>
  <rect x="160" y="817" width="122" height="42" rx="21" fill="#fff7ed"/>
  <rect x="300" y="817" width="122" height="42" rx="21" fill="#fff7ed"/>
  <rect x="440" y="817" width="122" height="42" rx="21" fill="#fff7ed"/>
  <text x="221" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#c2410c;">ARR</text>
  <text x="361" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#c2410c;">验收率</text>
  <text x="501" y="844" text-anchor="middle" class="small" style="font-weight:800;fill:#c2410c;">续费率</text>

  <!-- Central flywheel -->
  <g filter="url(#smallShadow)">
    <circle cx="960" cy="548" r="188" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <circle cx="960" cy="548" r="250" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 14"/>
  <path d="M1008 304 C1110 318 1188 372 1216 440" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1200 504 C1204 610 1162 700 1108 742" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <path d="M1048 778 C950 828 840 806 792 746" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <path d="M748 704 C684 620 684 506 724 448" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M762 405 C808 330 872 300 932 292" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <text x="960" y="520" text-anchor="middle" class="centerTitle">自进化飞轮</text>
  <text x="960" y="560" text-anchor="middle" class="centerSub">问题发现 → 样本回流 → 模型升级</text>
  <text x="960" y="594" text-anchor="middle" class="centerSub">方案优化 → 价值验证 → 规模复制</text>
  <rect x="830" y="625" width="260" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="960" y="654" text-anchor="middle" class="font" style="font-size:20px;font-weight:800;fill:#1d4ed8;">越交付 · 越精准 · 越易复制</text>

  <g filter="url(#smallShadow)">
    <rect x="878" y="260" width="164" height="70" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="1131" y="432" width="170" height="70" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="1025" y="724" width="172" height="70" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="724" y="724" width="172" height="70" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <rect x="622" y="432" width="174" height="70" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="960" y="288" text-anchor="middle" class="nodeTitle">数据资产沉淀</text>
  <text x="960" y="313" text-anchor="middle" class="nodeSub">样本 / 反馈 / 评测</text>
  <text x="1216" y="460" text-anchor="middle" class="nodeTitle">模型能力进化</text>
  <text x="1216" y="485" text-anchor="middle" class="nodeSub">小模型 / 多模态</text>
  <text x="1111" y="752" text-anchor="middle" class="nodeTitle">能力开放编排</text>
  <text x="1111" y="777" text-anchor="middle" class="nodeSub">Agent / Skill / API</text>
  <text x="810" y="752" text-anchor="middle" class="nodeTitle">行业方案复用</text>
  <text x="810" y="777" text-anchor="middle" class="nodeSub">模板 / 工作流</text>
  <text x="709" y="460" text-anchor="middle" class="nodeTitle">业务价值反哺</text>
  <text x="709" y="485" text-anchor="middle" class="nodeSub">验收 / 运营 / 续约</text>

  <!-- Bottom conclusion -->
  <g filter="url(#softShadow)">
    <rect x="120" y="925" width="1680" height="118" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <rect x="154" y="956" width="136" height="56" rx="28" fill="#0f172a"/>
  <text x="222" y="992" text-anchor="middle" class="font" style="font-size:22px;font-weight:800;fill:#ffffff;">投资结论</text>
  <text x="320" y="971" class="conclusion">深象的核心价值不是单点算法，而是“交付数据驱动模型与行业方案复利增长”的平台能力。</text>
  <g>
    <line x1="350" y1="1008" x2="1715" y2="1008" stroke="#e2e8f0" stroke-width="2"/>
    <text x="356" y="1032" class="small"><tspan style="font-weight:800;fill:#059669;">模型效果</tspan> 准确率 / 召回率</text>
    <text x="700" y="1032" class="small"><tspan style="font-weight:800;fill:#2563eb;">交付效率</tspan> 周期 / 成本 / 人效</text>
    <text x="1046" y="1032" class="small"><tspan style="font-weight:800;fill:#7c3aed;">收入质量</tspan> ARR / 毛利 / 续费</text>
    <text x="1390" y="1032" class="small"><tspan style="font-weight:800;fill:#ea580c;">护城河</tspan> 数据资产 / 方案库 / 客户网络</text>
  </g>
</svg>
